name: Cooperative carry tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_carry.py -q
      - run: python -m pytest tests/test_isaac_contracts.py -q
      - run: python -m compileall -q isaac_carry scripts/run_isaac_carry.py
      - run: g1-carry fetch-assets
      - run: python -m pytest tests/test_g1_integration.py -q
      - run: g1-carry run --config configs/carry_g1.toml --output results/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carry-results
          path: results/ci/
